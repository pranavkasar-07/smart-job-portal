server:
  port: ${PORT:8080}
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_job_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
app:
  jwt:
    # Override in environment. Use at least 32 random bytes in production.
    secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value-123456789}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  resume-dir: ${RESUME_DIR:uploads/resumes}
