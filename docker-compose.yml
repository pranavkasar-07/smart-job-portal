services:
  mysql:
    image: mysql:8.4
    container_name: smart-job-portal-db
    environment:
      MYSQL_DATABASE: smart_job_portal
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - jobportal_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    container_name: smart-job-portal-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/smart_job_portal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: change-this-to-a-random-secret-at-least-32-bytes-long
    ports:
      - "8080:8080"
volumes:
  jobportal_data:
